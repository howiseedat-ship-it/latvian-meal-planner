name: Validate Recipes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Validate JSON
        run: |
          python3 -c "
          import json
          with open('recipes.json') as f:
            recipes = json.load(f)
          print(f'Valid JSON: {len(recipes)} recipes')
          for r in recipes:
              assert 'id' in r, f'Missing id: {r.get(\"name\")}'
              assert 'name' in r, f'Missing name'
              assert 'nameLV' in r, f'Missing nameLV: {r.get(\"name\")}'
              assert 'ingredients' in r, f'Missing ingredients: {r.get(\"name\")}'
              assert 'steps' in r, f'Missing steps: {r.get(\"name\")}'
          print('All recipes valid')
          "
