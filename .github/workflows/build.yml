name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Diagnostics
        run: |
          echo "=== DIAG START $(date -u) ==="
          sw_vers
          xcodebuild -version
          swift --version
          echo "=== DIAG END $(date -u) ==="

      - name: Validate recipes JSON
        run: |
          python3 -c "import json; json.load(open('Sources/Data/recipes.json')); print('Recipes JSON valid')"

      - name: Build iOS app
        run: |
          set -e
          echo "=== BUILD START $(date -u) ==="
          xcodebuild \
            -scheme LatvianMealPlanner \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
          echo "=== BUILD END $(date -u) ==="

      - name: Package IPA
        run: |
          set -e
          BIN_PATH=$(find build/DerivedData/Build/Products/Release-iphoneos -name "LatvianMealPlanner" -type f -maxdepth 1 | head -1)
          if [ -z "$BIN_PATH" ]; then
            echo "No binary found"
            exit 1
          fi
          echo "Found binary: $BIN_PATH"
          APP_DIR="build/IPA/Payload/LatvianMealPlanner.app"
          mkdir -p "$APP_DIR"
          cp "$BIN_PATH" "$APP_DIR/LatvianMealPlanner"
          cp Resources/Info.plist "$APP_DIR/Info.plist"
          if [ -f Sources/Data/recipes.json ]; then
            cp Sources/Data/recipes.json "$APP_DIR/recipes.json"
          fi
          cd build/IPA
          zip -r -X ../LatvianMealPlanner.ipa Payload
          cd ../..
          ls -la build/LatvianMealPlanner.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: LatvianMealPlanner
          path: build/LatvianMealPlanner.ipa
          retention-days: 30
