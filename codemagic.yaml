workflows:
  default:
    name: Build unsigned LatvianMealPlanner IPA
    instance_type: mac_mini_m2
    max_build_duration: 20
    environment:
      xcode: latest
    scripts:
      - name: Validate recipes JSON
        script: |
          set -e
          python3 -c "import json; json.load(open('Sources/Data/recipes.json')); print('Recipes JSON valid')"
      - name: Build unsigned iOS app
        script: |
          set -e
          xcodebuild \
            -project LatvianMealPlanner.xcodeproj \
            -scheme LatvianMealPlanner \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
      - name: Package IPA
        script: |
          set -e
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/LatvianMealPlanner.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "No .app bundle found at $APP_PATH"
            find build/DerivedData -name "*.app" -type d 2>/dev/null
            exit 1
          fi
          echo "Found .app bundle: $APP_PATH"
          mkdir -p build/IPA/Payload
          cp -R "$APP_PATH" build/IPA/Payload/
          (cd build/IPA && zip -r -X ../LatvianMealPlanner.ipa Payload)
          ls -la build/LatvianMealPlanner.ipa
    artifacts:
      - build/LatvianMealPlanner.ipa
