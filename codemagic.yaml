workflows:
  Build:
    name: Build unsigned LatvianMealPlanner IPA
    instance_type: mac_mini_m2
    max_build_duration: 20
    environment:
      xcode: latest
    scripts:
      - name: Validate recipes JSON
        script: |
          set -e
          python3 -c "import json; json.load(open('Sources/Data/recipes.json')); print('Recipes JSON valid')"
      - name: Build unsigned iOS app
        script: |
          set -e
          xcodebuild \
            -scheme LatvianMealPlanner \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
      - name: Package IPA
        script: |
          set -e
          APP_PATH=$(find build/DerivedData/Build/Products/Release-iphoneos -name "*.app" -maxdepth 1 | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app found"
            exit 1
          fi
          mkdir -p build/IPA/Payload
          cp -R "$APP_PATH" build/IPA/Payload/
          (cd build/IPA && zip -r -X ../LatvianMealPlanner.ipa Payload)
          ls -la build/LatvianMealPlanner.ipa
    artifacts:
      - build/LatvianMealPlanner.ipa
